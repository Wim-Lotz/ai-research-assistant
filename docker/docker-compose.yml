services:
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Research@Assistant123
      - MSSQL_PID=Developer
    volumes:
      - sqlserver_storage:/var/opt/mssql
      - ./sql:/init
    entrypoint: /bin/bash /init/init.sh
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Research@Assistant123", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 10

  dab:
    image: mcr.microsoft.com/azure-databases/data-api-builder:latest
    container_name: dab
    ports:
      - "5000:5000"
    volumes:
      - ./dab-config.json:/App/dab-config.json
    command: ["--ConfigFileName", "/App/dab-config.json"]
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant_storage:
  sqlserver_storage: